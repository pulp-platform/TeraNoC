// VCS -msg_config for post-layout builds (hardware/Makefile, postlayout=1).
//
// The netlist's ports are flat vectors, so a port connected at the wrong width (PCWM-W) or left
// unconnected (TFIPC) is only a warning by default and the build goes through. Make both errors
// where the netlist is instantiated, and nowhere else.
//
// Use the WARNING id. Enabling the lint (+lint=PCWM) turns the message into PCWM-L, which
// -error does not upgrade from a config file -- the build then passes with the mismatch.
{ -error=PCWM-W,TFIPC; +module=terapool_cluster_floonoc_wrapper; }
